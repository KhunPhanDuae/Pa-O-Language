<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pa'O Language Learning</title>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: "Padauk", "Pyidaungsu", "Myanmar Text", Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; min-height: 100vh; line-height: 1.6;
        }
        header { background-color: #4CAF50; color: white; padding: 1em; text-align: center; }
        nav {
            background-color: #333; padding: 0.8em 1em; text-align: center;
            position: sticky; top: 0; z-index: 1000;
        }
        nav a {
            color: white; padding: 0.5em 0.8em; text-decoration: none;
            display: inline-block; font-size: 0.95rem; transition: background-color 0.3s;
        }
        nav a:hover { background-color: #4CAF50; color: white; border-radius: 4px; }
        main { flex: 1; padding: 1.5em; max-width: 900px; margin: 0 auto; width: 100%; }
        .lesson-section {
            background: white; padding: 1.2em 1.5em; margin-bottom: 1.5em;
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .lesson-section h2 {
            color: #2c3e50; border-bottom: 3px solid #4CAF50; padding-bottom: 0.3em; margin-top: 0;
        }
        .lesson-section h3 {
            color: #34495e; margin-top: 1.2em; margin-bottom: 0.4em;
        }
        ul { padding-left: 1.5em; }
        li { margin-bottom: 0.5em; }
        footer { background-color: #333; color: white; text-align: center; padding: 1em; margin-top: auto; }
        @media (max-width: 600px) {
            nav a { display: inline-block; padding: 0.4em 0.6em; font-size: 0.85rem; }
            .lesson-section { padding: 1em; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Pa'O Language Learning</h1>
    </header>

    <!-- Navigation Menu (paotxt.txt မှ အလိုအလျောက် ဆောက်ပေးမည်) -->
    <nav id="navbar"></nav>

    <!-- Main Content (paotxt.txt မှ အလိုအလျောက် ဆောက်ပေးမည်) -->
    <main id="app"></main>

    <footer>
        &copy; 2026 Pa'O Language Learning. All rights reserved.
    </footer>

    <script>
        fetch('paotxt.txt')
            .then(res => {
                if (!res.ok) throw new Error('paotxt.txt ဖိုင်ကို မတွေ့ပါ');
                return res.text();
            })
            .then(text => {
                const navbar = document.getElementById('navbar');
                const app = document.getElementById('app');
                
                let currentSection = null;
                let currentUl = null;

                text.split('\n').forEach(line => {
                    line = line.trim();
                    if (!line || line.startsWith('#')) return;

                    // ၁။ Section အသစ် [ id | Title | Subtitle ]
                    if (line.startsWith('[') && line.endsWith(']')) {
                        const parts = line.slice(1, -1).split('|').map(s => s.trim());
                        const id = parts[0];
                        const title = parts[1] || id;
                        const subtitle = parts[2] || '';

                        // Navbar Link ထည့်ခြင်း
                        const navLink = document.createElement('a');
                        navLink.href = `#${id}`;
                        navLink.textContent = title;
                        navbar.appendChild(navLink);

                        // Section Element ဆောက်ခြင်း
                        currentSection = document.createElement('section');
                        currentSection.id = id;
                        currentSection.className = 'lesson-section';

                        const h2 = document.createElement('h2');
                        h2.textContent = title;
                        currentSection.appendChild(h2);

                        if (subtitle) {
                            const p = document.createElement('p');
                            p.textContent = subtitle;
                            currentSection.appendChild(p);
                        }

                        currentUl = document.createElement('ul');
                        currentSection.appendChild(currentUl);
                        app.appendChild(currentSection);
                    } 
                    // ၂။ ခေါင်းစဉ်ခွဲများ === Subheading ===
                    else if (line.startsWith('===') || line.startsWith('###')) {
                        if (!currentSection) return;
                        const subTitle = line.replace(/^[=#\s]+|[=#\s]+$/g, '').trim();
                        
                        const h3 = document.createElement('h3');
                        h3.textContent = subTitle;
                        currentSection.appendChild(h3);

                        currentUl = document.createElement('ul');
                        currentSection.appendChild(currentUl);
                    }
                    // ၃။ စာကြောင်း ဒေတာများ (Key = Value)
                    else if (line.includes('=')) {
                        if (!currentUl && currentSection) {
                            currentUl = document.createElement('ul');
                            currentSection.appendChild(currentUl);
                        }
                        if (!currentUl) return;

                        const parts = line.split('=');
                        const pao = parts[0].trim();
                        const rest = parts[1] || '';

                        let pron = '', myan = '';
                        if (rest.includes(',')) {
                            const restParts = rest.split(',');
                            pron = restParts[0].trim();
                            myan = restParts.slice(1).join(',').trim();
                        } else {
                            myan = rest.trim();
                        }

                        const li = document.createElement('li');
                        if (pron && myan) {
                            li.innerHTML = `<strong>${pao}</strong> (${pron}) — ${myan}`;
                        } else if (myan) {
                            li.innerHTML = `<strong>${pao}</strong> — ${myan}`;
                        } else {
                            li.innerHTML = `<strong>${pao}</strong>`;
                        }
                        currentUl.appendChild(li);
                    }
                    // ၄။ ရိုးရိုး စာကြောင်းများ (Paragraphs)
                    else {
                        if (currentSection) {
                            const p = document.createElement('p');
                            p.textContent = line;
                            currentSection.appendChild(p);
                        }
                    }
                });
            })
            .catch(err => console.error('Error loading file:', err));
    </script>
</body>
</html>
